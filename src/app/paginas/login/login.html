<div class="login">
  <form class="tarjeta" [formGroup]="formulario" (ngSubmit)="entrar()" novalidate>
    <div class="login__marca">
      <img src="/logo.svg" alt="" />
      <strong>Gimnasio Titanes · Administración</strong>
    </div>

    @if (error(); as mensaje) {
      <div class="aviso aviso--error">{{ mensaje }}</div>
    }

    <div class="campo">
      <label for="correo">Correo</label>
      <input id="correo" type="email" formControlName="correo" placeholder="admin@itson.mx" autocomplete="username" />
      @if (c.correo.touched && c.correo.invalid) {
        <span class="error">Escribe un correo válido</span>
      }
    </div>

    <div class="campo">
      <label for="password">Contraseña</label>
      <input id="password" type="password" formControlName="password" autocomplete="current-password" />
      @if (c.password.touched && c.password.hasError('required')) {
        <span class="error">La contraseña es obligatoria</span>
      }
    </div>

    <button class="boton" type="submit" [disabled]="entrando()">
      {{ entrando() ? 'Entrando…' : 'Entrar' }}
    </button>
  </form>
</div>
