<nav class="filtro" aria-label="Filtrar por categoría">
  @for (opcion of opciones; track opcion) {
    <button
      type="button"
      [class.activo]="catalogo.categoria() === opcion"
      [attr.aria-pressed]="catalogo.categoria() === opcion"
      (click)="catalogo.elegirCategoria(opcion)"
    >
      {{ opcion }}
    </button>
  }
</nav>
