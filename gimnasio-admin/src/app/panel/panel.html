<header class="barra">
  <div class="barra__interior">
    <a routerLink="/clases" class="barra__marca">
      <img src="/logo.svg" alt="" />
      Gimnasio Titanes
    </a>
    <span class="barra__etiqueta">Administración</span>

    <!-- routerLink cambia de página sin recargar; routerLinkActive marca la ruta actual. -->
    <nav class="barra__enlaces">
      <a routerLink="/clases" routerLinkActive="barra__enlace--activo" class="barra__enlace">Clases</a>
      <a routerLink="/horarios" routerLinkActive="barra__enlace--activo" class="barra__enlace">Horarios</a>
      <a routerLink="/miembros" routerLinkActive="barra__enlace--activo" class="barra__enlace">Miembros</a>
      <span class="barra__quien">{{ sesion.usuario()?.nombre }}</span>
      <button class="boton boton--chico boton--secundario" type="button" (click)="sesion.salir()">Salir</button>
    </nav>
  </div>
</header>

<main class="pagina">
  <!-- Aquí se pintan las rutas hijas del panel (como <Outlet /> en React). -->
  <router-outlet />
</main>
